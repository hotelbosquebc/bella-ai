<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bella — Configurações</title>
    <style>
      body { font-family: system-ui, 'Segoe UI', sans-serif; max-width: 420px; margin: 40px auto; color: #1c2421; }
      h1 { color: #14502f; font-size: 20px; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
      input { width: 100%; padding: 10px; border: 1px solid #d7e5dd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
      button { margin-top: 18px; background: #1f6f43; color: #fff; border: none; border-radius: 8px; padding: 11px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
      #st { margin-top: 12px; font-size: 14px; }
      .muted { color: #6b7a73; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Bella 🌿 — Configurações</h1>
    <p class="muted">Entre com o mesmo login do painel da Bella. A extensão usa isso para buscar os atalhos e sugerir respostas.</p>
    <label>Endereço da API</label>
    <input id="apiUrl" value="https://bella-api-nh3h.onrender.com" />
    <label>E-mail</label>
    <input id="email" type="email" placeholder="digite seu e-mail do painel" required />
    <label>Senha</label>
    <input id="password" type="password" />
    <button id="save">Salvar e entrar</button>
    <div id="st"></div>
    <script src="options.js"></script>
  </body>
</html>
