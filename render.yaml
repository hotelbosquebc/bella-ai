# Blueprint do Render — publica a API da Bella (plano Free).
#
# O BANCO NÃO É MAIS CRIADO AQUI. Até 12/09/2026 este arquivo declarava um
# Postgres free do próprio Render, que expira em 30 dias e é APAGADO — aconteceu
# duas vezes, e na primeira levou todo o treinamento da Bella. O banco agora é
# externo (Supabase), e DATABASE_URL é preenchida à mão no painel.
#
# Não volte a declarar `databases:` aqui: o serviço é Blueprint managed, e um
# re-sync religaria a API a um banco free novo e vazio.

services:
  - type: web
    name: bella-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run db:generate -w apps/api && npm run build -w apps/api
    # migrate (cria as tabelas) + seed idempotente (admin, hotel, políticas) +
    # seed do treinamento (conhecimentos e respostas rápidas) + start
    startCommand: cd apps/api && npx prisma migrate deploy && node prisma/seed.js && node prisma/seed-conhecimento.js && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL # Supabase: use a URL do SESSION POOLER (...pooler.supabase.com:5432), não a conexão direta — a direta é só IPv6 e o Render não sai por IPv6
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_HOTEL_ID
        value: hotel-do-bosque
      - key: ADMIN_PASSWORD # senha do admin (defina no painel; o seed aplica a cada deploy)
        sync: false
      - key: BOOKING_ENGINE_BASE_URL
        value: https://sbreserva.silbeck.com.br/hotelbosque
      - key: BOOKING_ENGINE_PATH
        value: /pt-br/reserva/busca/
      # ===== Inteligência (Gemini gratuito) =====
      - key: AI_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY # mesma chave gratuita do Gemini já usada localmente
        sync: false
      # ===== Canais =====
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_PAGE_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
